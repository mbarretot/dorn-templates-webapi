version: 2
updates:
  - package-ecosystem: nuget
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      dorn-shared-packages:
        patterns:
          - "Dorn.Messaging*"
          - "Dorn.SharedKernel"
      dotnet-platform-packages:
        patterns:
          - "Microsoft.EntityFrameworkCore*"
          - "Microsoft.AspNetCore.*"
          - "Microsoft.Extensions.*"
          - "Microsoft.Data.Sqlite"
    commit-message:
      prefix: "chore(deps)"
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    commit-message:
      prefix: "ci"
